name: Release
on:
  push:
    branches:
      - main

permissions:
  contents: write # Required to create releases and tags
  issues: write   # Required to post comments on fixed issues
  pull-requests: write # Required to post comments on PRs
  id-token: write # Required for provenance/OIDC if publishing to npm

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history to analyze commits

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10 # Matches package.json packageManager

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Quality
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm exec semantic-release